<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>New Age · The Workspace</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,500&family=Manrope:wght@500;600&display=swap">
<style>
:root{--ink:#f6efe2;--panel:rgba(14,12,26,.9);--line:#4a4470;--gold:#d4a94f;--btn:rgba(14,12,26,.72);box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#07060f;font-family:'Manrope',system-ui,sans-serif;color:var(--ink)}
canvas{display:block;touch-action:none}
.bar{position:fixed;left:0;right:0;height:9vh;background:#000;z-index:4;transition:transform 1.4s ease}
#bt{top:0;transform:translateY(-100%)}#bb{bottom:0;transform:translateY(100%)}
body.cine #bt,body.cine #bb{transform:none}
#cap{position:fixed;left:0;right:0;bottom:11vh;text-align:center;font:italic 500 clamp(18px,3vw,28px) 'Cormorant Garamond',serif;letter-spacing:.06em;text-shadow:0 2px 14px #000;opacity:0;transition:opacity 1.2s;z-index:5;pointer-events:none}
#cap.on{opacity:1}
#ui{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;gap:7px;justify-content:center;flex-wrap:wrap;padding:0 8px;z-index:6;transition:opacity .8s}
body.cine #ui{opacity:0;pointer-events:none}
#ui button{font:inherit;font-weight:600;font-size:12.5px;padding:8px 13px;border-radius:7px;border:1px solid var(--line);background:var(--btn);color:var(--ink);cursor:pointer;backdrop-filter:blur(8px)}
#ui button:focus-visible{outline:2px solid var(--gold)}#ui button.on{background:var(--gold);color:#1a1530;border-color:var(--gold)}
#top{position:fixed;left:18px;top:calc(env(safe-area-inset-top,0px) + 12px);z-index:3;pointer-events:none;text-shadow:0 2px 12px #000b;transition:opacity .8s}
body.cine #top{opacity:0}
#top b{font:600 24px 'Cormorant Garamond',serif;letter-spacing:.2em}#top small{display:block;font-size:11.5px;opacity:.75;margin-top:2px}
#card{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 64px);width:min(320px,88vw);background:var(--panel);border:1px solid var(--gold);border-radius:10px;padding:12px 16px;display:none;z-index:7}
#card b{font:600 22px 'Cormorant Garamond',serif}#card div{font-size:13px;margin-top:3px;opacity:.9}
#intro{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#07060f;transition:opacity 2s;pointer-events:none;z-index:8}
#intro.hide{opacity:0}
#intro h1{font:600 clamp(40px,9vw,92px) 'Cormorant Garamond',serif;letter-spacing:.34em;margin:0 0 0 .34em;color:#e8c872}
#intro p{letter-spacing:.4em;font-size:12px;margin:12px 0 0;opacity:.8}
#snd{position:fixed;right:14px;top:calc(env(safe-area-inset-top,0px) + 12px);z-index:9;font:inherit;font-weight:600;font-size:12.5px;padding:8px 13px;border-radius:7px;border:1px solid var(--line);background:var(--btn);color:var(--ink);cursor:pointer;backdrop-filter:blur(8px)}#snd.on,#crk.on{background:var(--gold);color:#1a1530;border-color:var(--gold)}#crk{position:fixed;right:14px;top:calc(env(safe-area-inset-top,0px) + 54px);z-index:9;font:inherit;font-weight:600;font-size:12.5px;padding:8px 13px;border-radius:7px;border:1px solid var(--line);background:var(--btn);color:var(--ink);cursor:pointer;backdrop-filter:blur(8px)}
</style></head><body>
<div id="intro"><h1>NEW AGE</h1><p>A DIWALI EVENING</p></div>
<div class="bar" id="bt"></div><div class="bar" id="bb"></div><div id="cap"></div>
<div id="top"><b>NEW AGE</b><small>Drag to rotate · right-drag or two fingers to pan · scroll to zoom · tap a person</small></div>
<div id="card"></div>
<button id="snd">Music off</button><button id="crk">Crackers off</button>
<div id="ui"><button id="bTour">Cinematic tour</button><button data-v="overview">Overview</button><button data-v="reception">Reception</button><button data-v="studio">Workspace</button><button data-v="cabins">Cabins</button><button data-v="meeting">Meeting room</button><button data-v="pantry">Pantry</button><button id="bDay">Day</button><button id="bDiw" class="on">Diwali evening</button><button id="bFw">Fireworks</button></div>
